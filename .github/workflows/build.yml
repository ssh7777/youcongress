name: Production build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3'
          elixir-version: '1.19.4'
      - name: Check runtime configuration
        run: elixir scripts/runtime_config_test.exs
      - name: Build production Docker release
        run: docker build --progress=plain --tag youcongress:ci .

name: Production build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: you_congress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3'
          elixir-version: '1.19.4'
      - name: Test Vercel gateway builder
        run: node --test scripts/build-vercel.test.mjs
      - name: Check runtime configuration
        run: elixir scripts/runtime_config_test.exs
      - name: Build production Docker release
        run: docker build --progress=plain --tag apx:ci .
      - name: Test and preflight-build APX
        run: |
          npm ci --prefix vercel-app
          npm test --prefix vercel-app
          npm run build:next --prefix vercel-app
      - name: Verify the embedded APX production database path
        env:
          APX_DATABASE_MODE: embedded
        run: |
          npm run build --prefix vercel-app
          node vercel-app/test/embedded-integration.mjs
      - name: Migrate disposable database for Phoenix
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=ecto://postgres:postgres@localhost/you_congress
          -e DATABASE_SSL=false
          -e BASE_URL=http://localhost:4000
          -e SECRET_KEY_BASE=ci-only-secret-key-base-not-for-production-0123456789abcdef0123456789
          apx:ci /app/bin/migrate
      - name: Migrate the disposable APX database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost/postgres
          DATABASE_SSL: 'false'
        run: npm run migrate --prefix vercel-app
      - name: APX integration against the migrated schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost/postgres
          DATABASE_SSL: 'false'
          NATIVE_TEST_DATABASE: '1'
        run: node vercel-app/test/integration.mjs
      - name: Install browser smoke-test tools
        run: |
          npm install --prefix /tmp/apx-browser playwright@1.56.1
          /tmp/apx-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Migrate and smoke-test the production release
        env:
          NODE_PATH: /tmp/apx-browser/node_modules
        run: bash scripts/smoke_release.sh apx:ci

  regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3'
          elixir-version: '1.19.4'
      - run: mix deps.get
      - name: Compile test environment and run deployment regressions
        run: >-
          mix test
          test/you_congress_web/endpoint_test.exs
          test/you_congress_web/plugs/domain_redirect_test.exs
          test/you_congress_web/controllers/page_controller_test.exs
          test/you_congress_web/live/seo_meta_test.exs
          test/you_congress_web/mcp_server/statements_tools_test.exs
